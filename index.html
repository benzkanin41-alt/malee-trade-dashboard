<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MALEE Trade Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>MALEE Trade Dashboard</h1>
      <div id="sourceMeta" class="source-meta"></div>
    </div>
    <div class="top-controls">
      <label class="control">
        <span>Sheet</span>
        <select id="sheetSelect"></select>
      </label>
      <a class="workflow-link" href="UPDATE_WORKFLOW.md" target="_blank" rel="noreferrer">Update Workflow</a>
    </div>
  </header>

  <main class="layout">
    <aside class="series-panel">
      <div class="series-tools">
        <input id="seriesSearch" type="search" placeholder="ค้นหา series">
        <div class="button-row">
          <button id="defaultSeriesBtn" type="button">Default</button>
          <button id="allSeriesBtn" type="button">All</button>
          <button id="clearSeriesBtn" type="button">Clear</button>
        </div>
      </div>
      <div id="seriesList" class="series-list"></div>
    </aside>

    <section class="content">
      <section id="kpiStrip" class="kpi-strip"></section>

      <section class="chart-grid">
        <section class="chart-panel chart-panel-wide">
          <div class="panel-head">
            <h2>Value</h2>
            <span id="valueChartUnit"></span>
          </div>
          <svg id="valueChart" class="chart" role="img" aria-label="Value chart"></svg>
          <div id="valueLegend" class="chart-legend"></div>
        </section>
        <section class="chart-panel">
          <div class="panel-head">
            <h2>YoY</h2>
            <span>%</span>
          </div>
          <svg id="yoyChart" class="chart" role="img" aria-label="YoY chart"></svg>
          <div id="yoyLegend" class="chart-legend"></div>
        </section>
        <section class="chart-panel">
          <div class="panel-head">
            <h2>MoM</h2>
            <span>%</span>
          </div>
          <svg id="momChart" class="chart" role="img" aria-label="MoM chart"></svg>
          <div id="momLegend" class="chart-legend"></div>
        </section>
      </section>

      <section class="lower-grid">
        <section class="detail-panel">
          <div class="panel-head">
            <h2>Selected Point</h2>
            <span id="selectedMode"></span>
          </div>
          <dl id="pointDetail" class="point-detail"></dl>
        </section>

        <section class="table-panel">
          <div class="panel-head">
            <h2>Raw Data</h2>
            <span id="rawCount"></span>
          </div>
          <div id="rawTable" class="raw-table"></div>
        </section>
      </section>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
